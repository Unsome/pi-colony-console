name: daily-prices

on:
  schedule:
    - cron: "20 11 * * *"   # 매일 11:20 UTC (EVE 다운타임 이후, 하루 1회)
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Jita 7d-avg prices from ESI
        run: python engine/update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "pi-prices-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "no price change"
          else
            git commit -m "prices: daily ESI refresh"
            git push
          fi
